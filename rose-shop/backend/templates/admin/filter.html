{% load i18n %}
<div class="form-group">
    <label class="rose-shop-filter-label" for="filter-{{ field_name }}">{{ title|capfirst }}</label>
    <select id="filter-{{ field_name }}" class="form-control search-filter" data-name="{{ field_name }}">
        <option value="">{% trans 'All' %}</option>
        {% for choice in choices %}
            {% if choice.name %}
                <option data-name="{{ choice.name }}" value="{{ choice.value }}" {% if choice.selected %}selected{% endif %}>{{ choice.display }}</option>
            {% endif %}
        {% endfor %}
    </select>
</div>
