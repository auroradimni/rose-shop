{% extends "admin/base.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* Rose Shop — Change / View buttons (Bootstrap 5 uses CSS variables) */
  .app-wrapper a.rose-shop-change-btn,
  .app-wrapper a.changelink,
  .app-wrapper a.viewlink {
    --bs-btn-bg: #2d2d2d;
    --bs-btn-border-color: #2d2d2d;
    --bs-btn-color: #f7f3ee;
    --bs-btn-hover-bg: #1a1a1a;
    --bs-btn-hover-border-color: #1a1a1a;
    --bs-btn-hover-color: #fff;
    --bs-btn-active-bg: #1a1a1a;
    --bs-btn-active-border-color: #1a1a1a;
    --bs-btn-active-color: #fff;
    background-color: #2d2d2d !important;
    border-color: #2d2d2d !important;
    color: #f7f3ee !important;
  }

  .app-wrapper a.rose-shop-change-btn:hover,
  .app-wrapper a.changelink:hover,
  .app-wrapper a.viewlink:hover {
    background-color: #1a1a1a !important;
    border-color: #1a1a1a !important;
    color: #fff !important;
  }
</style>
{% endblock %}

{% block extrajs %}
{{ block.super }}
{% if admin_unread_counts %}
{{ admin_unread_counts|json_script:"admin-unread-counts" }}
<script>
document.addEventListener('DOMContentLoaded', function () {
  const counts = JSON.parse(document.getElementById('admin-unread-counts').textContent);
  document.querySelectorAll('aside a[href], .main-sidebar a[href], .app-sidebar a[href]').forEach(function (link) {
    const entry = counts.find(function (item) { return item.url === new URL(link.href, location.origin).pathname; });
    if (!entry || !entry.count) return;
    if (link.querySelector('.order-unread-badge')) return;
    const badge = document.createElement('span');
    badge.className = 'order-unread-badge';
    badge.textContent = entry.count;
    badge.setAttribute('aria-label', entry.count + ' ' + entry.label);
    badge.style.cssText = 'display:inline-block;margin-left:10px;padding:2px 7px;min-width:22px;border-radius:12px;background:#8B1A2B;color:white;font-size:12px;font-weight:600;text-align:center;';
    (link.querySelector('p') || link).appendChild(badge);
  });
});
</script>
{% endif %}
{% endblock %}
